<!-- actividad_1.html -->
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Actividad 1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.5.0/dist/ml5.min.js"></script>
  </head>
  <body>
    <h1>Actividad 1 - Cargar imagen y clasificar</h1>
    <input type="file" id="imageUpload" accept="image/*">
    <div id="result"></div>

    <script>
      let classifier;
      let imgElement = document.getElementById('imageUpload');
      let resultDiv = document.getElementById('result');

      // Cargar el modelo previamente entrenado
      function preload() {
        classifier = ml5.imageClassifier('https://teachablemachine.withgoogle.com/models/[MODEL_URL]/model.json');
      }

      // Cargar la imagen seleccionada
      imgElement.addEventListener('change', handleImage, false);

      function handleImage(event) {
        const file = event.target.files[0];
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => classifyImage(img);
      }

      // Clasificar la imagen
      function classifyImage(img) {
        classifier.classify(img, (error, results) => {
          if (error) {
            resultDiv.innerHTML = 'Error: ' + error;
          } else {
            resultDiv.innerHTML = 'Resultado: ' + results[0].label + ' (Confianza: ' + (results[0].confidence * 100).toFixed(2) + '%)';
          }
        });
      }
    </script>
  </body>
</html>
