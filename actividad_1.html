<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actividad 1 - Reconocimiento de Imagen</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- CSS Propio -->
  <link rel="stylesheet" href="CSS/actividad1.css">

  <!-- Librerías de ml5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
</head>

<body>
  <main class="container text-center py-5">
    <h1 class="mb-4">Actividad 1: Reconocimiento de Imagen (MobileNet)</h1>

    <!-- Carga de imagen -->
    <input type="file" id="inputImagen" accept="image/*" class="form-control mb-3" />
    <img id="imagenSeleccionada" class="imagen-preview" alt="Vista previa" />

    <!-- Botón para identificar -->
    <button id="btnIdentificar" class="btn btn-primary mt-3">Identificar Imagen</button>

    <!-- Resultado -->
    <div id="resultado" class="resultado mt-4"></div>

    <!-- Volver al inicio -->
    <a href="index.html" class="btn btn-secondary mt-4">Volver al Menú</a>
  </main>

  <!-- Vincular el archivo JS -->
  <script src="JS/actividad1.js"></script>
</body>

</html>
